<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Frame it</title>
<style>
:root{
  --bg:#e9ecee; --panel:#f7f8f9; --line:#d3d8dc; --text:#1f2a30; --muted:#5f6c74;
  --accent:#1f8a83; --accent-ink:#ffffff; --stage:#d7dce0;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#22272b; --panel:#2b3136; --line:#3b4349; --text:#e3e7ea; --muted:#9aa5ad;
    --accent:#3fb3aa; --accent-ink:#0f1a1c; --stage:#1a1e21;
  }
}
:root[data-theme="dark"]{
  --bg:#22272b; --panel:#2b3136; --line:#3b4349; --text:#e3e7ea; --muted:#9aa5ad;
  --accent:#3fb3aa; --accent-ink:#0f1a1c; --stage:#1a1e21;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
body{margin:0;min-height:100%;background:var(--bg);color:var(--text);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;font-size:15px;line-height:1.45}
.app{display:grid;grid-template-columns:1fr 320px;min-height:100vh}
.stage{background:var(--stage);display:flex;align-items:center;justify-content:center;padding:28px;position:relative;min-height:60vh}
.stage canvas{max-width:100%;max-height:calc(100vh - 56px);box-shadow:0 10px 40px rgba(0,0,0,.25);display:none}
.stage.has-img canvas{display:block}
.drop{border:2px dashed var(--line);border-radius:14px;padding:48px 36px;text-align:center;max-width:420px;cursor:pointer;color:var(--muted)}
.drop strong{display:block;color:var(--text);font-size:20px;margin-bottom:6px}
.stage.has-img .drop{display:none}
.stage.dragging{outline:3px solid var(--accent);outline-offset:-10px}
aside{background:var(--panel);border-left:1px solid var(--line);padding:24px 22px;display:flex;flex-direction:column;gap:22px}
h1{font-size:22px;margin:0;font-weight:700;letter-spacing:-.01em}
h2{font-size:14px;margin:0 0 10px;font-weight:600;color:var(--muted)}
.presets{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.chip{border:1px solid var(--line);background:transparent;color:var(--text);border-radius:10px;padding:9px 10px;text-align:left;cursor:pointer;font:inherit}
.chip small{display:block;color:var(--muted);font-size:12px}
.chip[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.row{display:flex;align-items:center;gap:12px}
input[type=range]{flex:1;accent-color:var(--accent)}
.val{min-width:46px;text-align:right;font-weight:600;font-variant-numeric:tabular-nums}
.swatches{display:flex;gap:8px;align-items:center}
.sw{width:34px;height:34px;border-radius:50%;border:2px solid var(--line);cursor:pointer;padding:0}
.sw[aria-pressed="true"]{outline:2px solid var(--accent);outline-offset:2px}
input[type=color]{width:34px;height:34px;border:none;padding:0;background:none;cursor:pointer}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{flex:1;border:none;background:transparent;color:var(--text);padding:9px;font:inherit;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);font-weight:600}
.info{color:var(--muted);font-size:13px}
.save{margin-top:auto;border:none;background:var(--accent);color:var(--accent-ink);font:inherit;font-weight:700;font-size:16px;padding:14px;border-radius:12px;cursor:pointer}
.save:disabled{opacity:.45;cursor:not-allowed}
.secondary{border:1px solid var(--line);background:transparent;color:var(--text);font:inherit;padding:10px;border-radius:10px;cursor:pointer}
.status{font-size:13px;color:var(--muted);min-height:1.2em}
button:focus-visible,input:focus-visible,.drop:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (max-width:820px){
  .app{grid-template-columns:1fr}
  aside{border-left:none;border-top:1px solid var(--line)}
  .stage canvas{max-height:65vh}
}
</style>
</head>
<body>
<div class="app">
  <main class="stage" id="stage">
    <div class="drop" id="drop" tabindex="0" role="button" aria-label="Choose a photo">
      <strong>Drop your photo here</strong>
      or click to choose one. JPEG, PNG or WebP.
    </div>
    <canvas id="cv" aria-label="Preview"></canvas>
    <input type="file" id="file" accept="image/jpeg,image/png,image/webp" hidden>
  </main>

  <aside>
    <h1>Frame it</h1>

    <section>
      <h2>Size</h2>
      <div class="presets" id="presets"></div>
    </section>

    <section>
      <h2>Border</h2>
      <div class="row">
        <input type="range" id="bw" min="0" max="15" step="0.5" value="3" aria-label="Border width">
        <span class="val" id="bwv">3%</span>
      </div>
    </section>

    <section>
      <h2>Border color</h2>
      <div class="swatches" id="swatches">
        <button class="sw" data-c="#ffffff" style="background:#ffffff" aria-label="White"></button>
        <button class="sw" data-c="#f2f0ec" style="background:#f2f0ec" aria-label="Warm white"></button>
        <button class="sw" data-c="#000000" style="background:#000000" aria-label="Black"></button>
        <input type="color" id="custom" value="#2b3136" aria-label="Custom color">
      </div>
    </section>

    <section>
      <h2>Photo placement</h2>
      <div class="seg" id="mode">
        <button data-m="fit" aria-pressed="true">Show whole photo</button>
        <button data-m="fill" aria-pressed="false">Fill and crop</button>
      </div>
    </section>

    <section>
      <h2>File type</h2>
      <div class="seg" id="fmt">
        <button data-f="jpg" aria-pressed="true">JPEG, for Instagram</button>
        <button data-f="png" aria-pressed="false">PNG, lossless</button>
      </div>
    </section>

    <p class="info" id="info">Add a photo to see the preview.</p>

    <button class="secondary" id="another" hidden>Use another photo</button>
    <button class="save" id="save" disabled>Save JPEG</button>
    <p class="status" id="status" role="status"></p>
  </aside>
</div>

<script>
const PRESETS = [
  {id:"post", name:"Instagram post", sub:"4:5 · 1080×1350", w:1080, h:1350},
  {id:"square", name:"Square", sub:"1:1 · 1080×1080", w:1080, h:1080},
  {id:"story", name:"Story", sub:"9:16 · 1080×1920", w:1080, h:1920},
  {id:"land", name:"Landscape", sub:"1.91:1 · 1080×566", w:1080, h:566},
  {id:"orig", name:"Original ratio", sub:"1080 wide", w:1080, h:null},
  {id:"origL", name:"Original, large", sub:"2048 long edge", w:null, h:null, long:2048},
  {id:"full", name:"Full size", sub:"No resizing, all detail", w:null, h:null}
];
const FREE = ["orig","origL","full"];

const state = { preset:"post", bw:3, color:"#ffffff", mode:"fit", fmt:"jpg", img:null, name:"photo" };
try{
  const saved = JSON.parse(localStorage.getItem("frameit-settings")||"null");
  if(saved){ Object.assign(state, {preset:saved.preset||state.preset, bw:saved.bw ?? state.bw, color:saved.color||state.color, mode:saved.mode||state.mode, fmt:saved.fmt||state.fmt}); }
}catch(e){}
function persist(){ try{ localStorage.setItem("frameit-settings", JSON.stringify({preset:state.preset,bw:state.bw,color:state.color,mode:state.mode,fmt:state.fmt})); }catch(e){} }

const $ = id => document.getElementById(id);
const cv = $("cv"), ctx = cv.getContext("2d");

// Presets UI
const presetsEl = $("presets");
PRESETS.forEach(p=>{
  const b = document.createElement("button");
  b.className="chip"; b.dataset.id=p.id;
  b.innerHTML = `${p.name}<small>${p.sub}</small>`;
  b.onclick = ()=>{ state.preset=p.id; sync(); };
  presetsEl.appendChild(b);
});

$("bw").oninput = e => { state.bw = parseFloat(e.target.value); sync(); };
document.querySelectorAll(".sw").forEach(s => s.onclick = () => { state.color = s.dataset.c; sync(); });
$("custom").oninput = e => { state.color = e.target.value; sync(); };
document.querySelectorAll("#mode button").forEach(b => b.onclick = () => { state.mode = b.dataset.m; sync(); });
document.querySelectorAll("#fmt button").forEach(b => b.onclick = () => { state.fmt = b.dataset.f; sync(); });

function computeLayout(){
  const img = state.img, p = PRESETS.find(x=>x.id===state.preset);
  const iw0 = img.naturalWidth, ih0 = img.naturalHeight, ar = ih0/iw0;
  let W, H, b;
  if(p.id==="full"){
    const pct = state.bw/100;
    W = Math.round(iw0/(1-2*pct));
    b = Math.round(W*pct);
    H = Math.round((W-2*b)*ar) + 2*b;
  } else if(p.id==="orig" || p.id==="origL"){
    if(p.id==="orig"){ W = 1080; }
    else { W = ar >= 1 ? null : 2048; }
    if(W===null){ // portrait large: long edge is height
      // solve for W so that H = 2048
      // H = (W-2b)*ar + 2b with b = round(W*pct)
      const pct = state.bw/100;
      W = Math.round(2048 / (ar + 2*pct*(1-ar)));
    }
    b = Math.round(W*state.bw/100);
    const innerW = W-2*b;
    H = Math.round(innerW*ar) + 2*b;
  } else {
    W = p.w; H = p.h; b = Math.round(W*state.bw/100);
  }
  return {W,H,b};
}

function render(){
  if(!state.img) return;
  const {W,H,b} = computeLayout();
  cv.width = W; cv.height = H;
  ctx.fillStyle = state.color; ctx.fillRect(0,0,W,H);
  const img = state.img, iw = img.naturalWidth, ih = img.naturalHeight;
  const bx = W-2*b, by = H-2*b;
  const scale = state.mode==="fit" ? Math.min(bx/iw, by/ih) : Math.max(bx/iw, by/ih);
  const dw = iw*scale, dh = ih*scale;
  const dx = b + (bx-dw)/2, dy = b + (by-dh)/2;
  ctx.save();
  ctx.beginPath(); ctx.rect(b,b,bx,by); ctx.clip();
  ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = "high";
  ctx.drawImage(img, dx, dy, dw, dh);
  ctx.restore();
  const big = W*H > 16e6 ? " Large file, may take a moment." : "";
  $("info").textContent = `Output ${W} × ${H} px, border ${b} px, ${state.fmt==="png"?"PNG lossless":"JPEG 92%"}.${big}`;
}

function sync(){
  document.querySelectorAll(".chip").forEach(c => c.setAttribute("aria-pressed", c.dataset.id===state.preset));
  document.querySelectorAll(".sw").forEach(s => s.setAttribute("aria-pressed", s.dataset.c===state.color));
  document.querySelectorAll("#mode button").forEach(b => b.setAttribute("aria-pressed", b.dataset.m===state.mode));
  $("bw").value = state.bw; $("bwv").textContent = state.bw + "%";
  const p = PRESETS.find(x=>x.id===state.preset);
  document.querySelector("#mode").style.opacity = FREE.includes(p.id) ? .45 : 1;
  document.querySelectorAll("#fmt button").forEach(b => b.setAttribute("aria-pressed", b.dataset.f===state.fmt));
  $("save").textContent = state.fmt==="png" ? "Save PNG (lossless)" : "Save JPEG";
  persist(); render();
}

// Loading
function loadFile(f){
  if(!f) return;
  if(!/^image\/(jpeg|png|webp)$/.test(f.type)){
    $("status").textContent = "That file type won't open here. Export a JPEG from your editor and try again.";
    return;
  }
  const url = URL.createObjectURL(f);
  const img = new Image();
  img.onload = () => {
    state.img = img; state.name = f.name.replace(/\.[^.]+$/,"");
    $("stage").classList.add("has-img");
    $("save").disabled = false; $("another").hidden = false;
    $("status").textContent = "";
    sync();
  };
  img.onerror = () => { $("status").textContent = "Couldn't read that photo. Try exporting it again as JPEG."; };
  img.src = url;
}
$("drop").onclick = () => $("file").click();
$("drop").onkeydown = e => { if(e.key==="Enter"||e.key===" "){ e.preventDefault(); $("file").click(); } };
$("another").onclick = () => $("file").click();
$("file").onchange = e => loadFile(e.target.files[0]);
const stage = $("stage");
["dragenter","dragover"].forEach(ev => stage.addEventListener(ev, e => { e.preventDefault(); stage.classList.add("dragging"); }));
["dragleave","drop"].forEach(ev => stage.addEventListener(ev, e => { e.preventDefault(); stage.classList.remove("dragging"); }));
stage.addEventListener("drop", e => loadFile(e.dataTransfer.files[0]));

// Saving (standard browser download)
$("save").onclick = () => {
  if(!state.img) return;
  const p = PRESETS.find(x=>x.id===state.preset);
  const fname = `${state.name}-${p.id}-${state.bw}pct.${state.fmt}`;
  const mime = state.fmt==="png" ? "image/png" : "image/jpeg";
  $("status").textContent = "Preparing file…";
  cv.toBlob(blob => {
    if(!blob){ $("status").textContent = "Couldn't create the file."; return; }
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = fname;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 10000);
    $("status").textContent = "Saved " + fname;
  }, mime, 0.92);
};

sync();
</script>
</body>
</html>
